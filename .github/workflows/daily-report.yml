# Daily MLB prediction pipeline: pulls new results, updates Elo, simulates,
# grades yesterday, emails three reports, and commits the site data.
#
# This is the formerly-paused daily cron (it used to build the NBA odds
# report; that generator still exists at data_jobs/reports/ and can be run
# via workflow_dispatch of a shell step if ever needed again).

name: Daily MLB Report

on:
  schedule:
    # 10:00 UTC = 6:00 AM ET (DST) - overnight games are final, first pitch
    # is hours away. The run dated D grades D-1 and predicts D's slate.
    - cron: "0 10 * * *"

  # Fires once immediately when the pipeline lands on main (and on any later
  # fix to it), so the first emails go out on merge rather than waiting for
  # the next 10:00 UTC. Commits made by this workflow itself use GITHUB_TOKEN
  # and therefore cannot re-trigger it.
  push:
    branches: [main]
    paths:
      - "mlb/daily/**"
      - ".github/workflows/daily-report.yml"

  workflow_dispatch:
    inputs:
      run_date:
        description: "Override run date (YYYY-MM-DD ET, default today)"
        required: false
        default: ""
        type: string
      skip_email:
        description: "Skip sending email"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: daily-report-${{ github.ref }}
  cancel-in-progress: false

env:
  REPORT_EMAIL: tremayne.watterson@gmail.com

jobs:
  mlb-daily:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Per-start pitching lines for the shadow SP model: checkpointed and
      # resumable, so the first run backfills the 2026 season and each later
      # run re-scans a rolling 7-day tail (see mlb/build_starts_statsapi.py)
      # so a game still suspended/delayed on its date is picked up once it
      # finalizes - already-checkpointed games aren't re-fetched, so this
      # stays cheap. Non-fatal: if statsapi hiccups, the SP books just lag
      # a day and the emails still go out.
      - name: Update pitcher starts (statsapi)
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -m mlb.build_starts_statsapi
          python -m mlb.load_starts_db

      - name: Run daily pipeline
        id: pipeline
        shell: bash
        env:
          # Optional: set the DATABASE_URL repo secret (Neon Postgres) to
          # mirror each day's outputs into mlb_slate_predictions,
          # mlb_daily_grades and mlb_futures. Skipped cleanly when unset.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail

          RUN_DATE="${{ github.event.inputs.run_date }}"
          if [ -n "${RUN_DATE:-}" ]; then
            python -m mlb.daily.run --date "$RUN_DATE"
          else
            python -m mlb.daily.run
          fi

          MANIFEST=reports/mlb_daily/manifest_latest.json
          {
            echo "date=$(jq -r '.date' $MANIFEST)"
            echo "graded_date=$(jq -r '.graded_date // ""' $MANIFEST)"
            echo "futures_path=$(jq -r '.emails.futures.path // ""' $MANIFEST)"
            echo "futures_subject=$(jq -r '.emails.futures.subject // ""' $MANIFEST)"
            echo "futures_send=$(jq -r '.emails.futures.send // false' $MANIFEST)"
            echo "slate_path=$(jq -r '.emails.slate.path // ""' $MANIFEST)"
            echo "slate_subject=$(jq -r '.emails.slate.subject // ""' $MANIFEST)"
            echo "slate_send=$(jq -r '.emails.slate.send // false' $MANIFEST)"
            echo "grade_path=$(jq -r '.emails.grade.path // ""' $MANIFEST)"
            echo "grade_subject=$(jq -r '.emails.grade.subject // ""' $MANIFEST)"
            echo "grade_send=$(jq -r '.emails.grade.send // false' $MANIFEST)"
          } >> "$GITHUB_OUTPUT"

      - name: Commit and push outputs
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/mlb/ reports/mlb_daily/ web/public/data/mlb/

          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "MLB daily: ${{ steps.pipeline.outputs.date }}"
            bash .github/scripts/git-push-retry.sh main
          else
            echo "No changes to commit."
          fi

      - name: Decide whether to send email
        id: emailgate
        shell: bash
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          set -euo pipefail

          SKIP="${{ github.event.inputs.skip_email }}"
          if [ "${SKIP:-false}" = "true" ]; then
            echo "send=false" >> "$GITHUB_OUTPUT"
            echo "Email skipped by input."
            exit 0
          fi

          if [ -z "${SMTP_USERNAME:-}" ] || [ -z "${SMTP_PASSWORD:-}" ]; then
            echo "send=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Email not sent - SMTP credentials not configured."
            exit 0
          fi

          echo "send=true" >> "$GITHUB_OUTPUT"

      # always() so a failed/skipped earlier send (e.g. one transient SMTP
      # error) never blocks the others - each of the three is independent.
      - name: "Email 1: futures forecast"
        id: email-futures
        if: ${{ always() && steps.emailgate.outputs.send == 'true' && steps.pipeline.outputs.futures_path != '' && steps.pipeline.outputs.futures_send == 'true' }}
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER || 'smtp.gmail.com' }}
          server_port: ${{ secrets.SMTP_PORT || 587 }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          to: ${{ env.REPORT_EMAIL }}
          from: ${{ secrets.SMTP_FROM || secrets.SMTP_USERNAME }}
          subject: ${{ steps.pipeline.outputs.futures_subject }}
          html_body: file://${{ steps.pipeline.outputs.futures_path }}
          ignore_cert: true

      - name: "Email 2: today's slate"
        id: email-slate
        if: ${{ always() && steps.emailgate.outputs.send == 'true' && steps.pipeline.outputs.slate_path != '' && steps.pipeline.outputs.slate_send == 'true' }}
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER || 'smtp.gmail.com' }}
          server_port: ${{ secrets.SMTP_PORT || 587 }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          to: ${{ env.REPORT_EMAIL }}
          from: ${{ secrets.SMTP_FROM || secrets.SMTP_USERNAME }}
          subject: ${{ steps.pipeline.outputs.slate_subject }}
          html_body: file://${{ steps.pipeline.outputs.slate_path }}
          ignore_cert: true

      - name: "Email 3: yesterday's grade"
        id: email-grade
        if: ${{ always() && steps.emailgate.outputs.send == 'true' && steps.pipeline.outputs.grade_path != '' && steps.pipeline.outputs.grade_send == 'true' }}
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER || 'smtp.gmail.com' }}
          server_port: ${{ secrets.SMTP_PORT || 587 }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          to: ${{ env.REPORT_EMAIL }}
          from: ${{ secrets.SMTP_FROM || secrets.SMTP_USERNAME }}
          subject: ${{ steps.pipeline.outputs.grade_subject }}
          html_body: file://${{ steps.pipeline.outputs.grade_path }}
          ignore_cert: true

      # The three sends above use continue-on-error so one bad send (e.g. a
      # stale SMTP credential) never blocks the others - but that also hides
      # the failure from the run's conclusion. Surface it explicitly here.
      - name: Verify emails delivered
        if: ${{ always() && steps.emailgate.outputs.send == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.email-futures.outcome }}" = "failure" ] || \
             [ "${{ steps.email-slate.outcome }}" = "failure" ] || \
             [ "${{ steps.email-grade.outcome }}" = "failure" ]; then
            echo "::error::One or more emails failed to send - check SMTP credentials."
            exit 1
          fi
          echo "All attempted emails sent successfully."

      # Idempotency ledger: remember what was actually delivered, keyed on
      # (report_type, date) with a content hash, so a rerun of the same day
      # re-sends nothing unless the report content changed. Recording happens
      # only for steps that succeeded - a failed send is retried next run.
      - name: Record deliveries
        if: ${{ always() && steps.emailgate.outputs.send == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          TYPES=""
          [ "${{ steps.email-futures.outcome }}" = "success" ] && TYPES="$TYPES futures"
          [ "${{ steps.email-slate.outcome }}" = "success" ] && TYPES="$TYPES slate"
          [ "${{ steps.email-grade.outcome }}" = "success" ] && TYPES="$TYPES grade"
          TYPES="$(echo "$TYPES" | xargs || true)"
          if [ -z "$TYPES" ]; then
            echo "No deliveries to record."
            exit 0
          fi
          python -m mlb.daily.send_ledger record \
            --date "${{ steps.pipeline.outputs.date }}" \
            --graded-date "${{ steps.pipeline.outputs.graded_date }}" \
            --types "$TYPES"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/mlb_daily/sent.json
          if [ -n "$(git status --porcelain reports/mlb_daily/sent.json)" ]; then
            git commit -m "MLB daily: record deliveries ${{ steps.pipeline.outputs.date }}"
            bash .github/scripts/git-push-retry.sh main
          fi

      - name: Upload report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlb-daily-${{ github.run_number }}
          path: reports/mlb_daily/
          retention-days: 30
