# One-off backfill of free NBA model inputs (SportsDataverse ESPN and NBA
# Stats tables, FiveThirtyEight history), nflverse injury reports, and an
# FBref availability probe. The dev sandbox cannot reach these hosts, so
# the fetch runs here. Raw files go up as an artifact; files small enough
# to commit, plus the manifest, are pushed back to the branch that ran it.
# Fires on a push to its own development branch and on demand.

name: NBA data backfill

on:
  workflow_dispatch:
  push:
    branches: [claude/loving-mayer-15d9re-nba-data]
    paths:
      - "data_jobs/nba/**"
      - ".github/workflows/nba-data-backfill.yml"

permissions:
  contents: write

concurrency:
  group: nba-data-backfill-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch
        run: python -m data_jobs.nba.fetch_backfill

      - name: Upload raw files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nba-backfill-raw-${{ github.run_number }}
          path: data/nba/raw/
          retention-days: 90

      - name: Commit manifest and small files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nba/backfill_manifest.json data/nba/fbref_probe.json data/nba/sdv/ || true
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "NBA data backfill: $(date -u +%F)"
            bash .github/scripts/git-push-retry.sh "$GITHUB_REF_NAME"
          else
            echo "No changes to commit."
          fi
